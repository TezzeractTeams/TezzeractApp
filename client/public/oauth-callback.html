<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .message {
      color: #333;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div class="message">Completing connection...</div>
  </div>
  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const success = urlParams.get('success');
    const error = urlParams.get('error');
    const platform = urlParams.get('platform');

    // Send message to parent window
    if (window.opener) {
      if (success === 'connected') {
        window.opener.postMessage({ type: 'oauth-success', success: 'connected', platform: platform || null }, window.location.origin);
      } else if (error) {
        window.opener.postMessage({ type: 'oauth-error', error: error }, window.location.origin);
      } else {
        window.opener.postMessage({ type: 'oauth-success', success: 'connected', platform: platform || null }, window.location.origin);
      }
    }

    // Close the popup after a short delay
    setTimeout(() => {
      window.close();
    }, 500);
  </script>
</body>
</html>
